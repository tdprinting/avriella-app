<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #120d24; overflow: hidden; font-family: sans-serif; color: #fff; }
  #them { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #120d24; }
  #me { position: absolute; right: 14px; bottom: 14px; width: 26vmin; border-radius: 18px; transform: scaleX(-1); box-shadow: 0 6px 24px rgba(0,0,0,.5); border: 3px solid rgba(255,255,255,.8); }
  #wait { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(circle at 50% 40%, #ff8fb4 0%, #8e63f7 55%, #2a1d5c 100%); transition: opacity .6s; }
  #wait .big { font-size: 22vmin; animation: bob 1.6s ease-in-out infinite; }
  #wait .t { font-size: 6vmin; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,.3); }
  @keyframes bob { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-4vmin) scale(1.08); } }
  .hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<video id="them" autoplay playsinline></video>
<div id="wait"><div class="big">📞</div><div class="t">Someone who loves you is calling!</div></div>
<video id="me" autoplay playsinline muted></video>
<script>
(function () {
  var pc = null, local = null, ended = false, discTimer = null;
  function log(s) { try { Phone.log(String(s)); } catch (e) {} }
  function hangup() {
    if (ended) return; ended = true;
    try { if (local) local.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    try { if (pc) pc.close(); } catch (e) {}
    Phone.hangup();
  }
  function iceDone(pc, ms) {
    return new Promise(function (res) {
      if (pc.iceGatheringState === "complete") return res();
      var t = setTimeout(res, ms);
      pc.addEventListener("icegatheringstatechange", function () { if (pc.iceGatheringState === "complete") { clearTimeout(t); res(); } });
    });
  }
  function getMedia(tries) {
    return navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    }).catch(function (e) {
      log("camera/mic not ready: " + e);
      if (tries <= 0) throw e;
      return new Promise(function (r) { setTimeout(r, 1000); }).then(function () { return getMedia(tries - 1); });
    });
  }
  async function run() {
    var offer = JSON.parse(Phone.offer() || "null");
    if (!offer) { hangup(); return; }
    try { local = await getMedia(6); $me().srcObject = local; } catch (e) { log("no camera, audio only"); local = null; }
    pc = new RTCPeerConnection({ iceServers: [{ urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"] }] });
    if (local) local.getTracks().forEach(function (t) { pc.addTrack(t, local); });
    pc.ontrack = function (e) {
      var v = document.getElementById("them");
      if (v.srcObject !== e.streams[0]) { v.srcObject = e.streams[0]; v.play().catch(function () {}); }
      document.getElementById("wait").classList.add("hidden");
    };
    pc.onconnectionstatechange = function () {
      log("call " + pc.connectionState);
      if (pc.connectionState === "connected") { clearTimeout(discTimer); Phone.connected(); }
      if (pc.connectionState === "failed" || pc.connectionState === "closed") hangup();
      if (pc.connectionState === "disconnected") { clearTimeout(discTimer); discTimer = setTimeout(function () { if (pc.connectionState !== "connected") hangup(); }, 10000); }
    };
    await pc.setRemoteDescription(offer);
    var answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await iceDone(pc, 4000);
    Phone.answer(JSON.stringify(pc.localDescription));
  }
  function $me() { return document.getElementById("me"); }
  setInterval(function () { if (!ended && Phone.state() === "ended") hangup(); }, 700);
  run().catch(function (e) { log("call failed: " + e); hangup(); });
})();
</script>
</body>
</html>
